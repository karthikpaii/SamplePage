<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Animation</title>

<style>
    *
    {
        text-align: center;
    }
.loader {
    display: flex;
    align-items: center;
    font-size: 20px;
}

/* Container (only 1 word visible) */
.words {
    position: relative;
    overflow: hidden;
    height: 40px;
}



/* Moving list */
.words-inner {
    display: flex;
    flex-direction: column;
    animation: spin 6s infinite;
}

/* Each word */
.word {
    height: 40px;
    line-height: 40px;
    padding-left: 6px;
    color: #005bef;
    font-weight: 500;
}

/* Animation */
@keyframes spin {
    0%   { transform: translateY(0); }
    20%  { transform: translateY(-40px); }
    40%  { transform: translateY(-80px); }
    60%  { transform: translateY(-120px); }
    80%  { transform: translateY(-160px); }
    100% { transform: translateY(-200px); }
}
</style>

</head>
<body>

<div class="card">
    <div class="loader">
        <p>I Like</p>

        <div class="words">
            <div class="words-inner">
                <span class="word">Python</span>
                <span class="word">JavaScript</span>
                <span class="word">C Language</span>
                <span class="word">CSS</span>
                <span class="word">HTML</span>
            </div>
        </div>

    </div>
</div>

</body>
</html>
