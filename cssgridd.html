<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;               /* Enable Grid */
  grid-template-columns: 100px 100px 100px; /* 3 columns, each 100px */
  grid-template-rows: 80px 80px;           /* 2 rows, each 80px */
  gap: 10px;                   /* space between grid items */
  background-color: #ddd;
  padding: 10px;
}


.item {
  background-color: #4CAF50;
  color: white;
  text-align: center;
  line-height: 80px;
  font-size: 20px;
}
</style>
</head>
<body>

<h2>Basic CSS Grid</h2>

<div class="container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
  <div class="item">5</div>
  <div class="item">6</div>
</div>

</body>
</html>
